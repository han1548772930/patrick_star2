[package]
name = "patrick_star2"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.24.0"
femtovg = { version = "0.25.1", default-features = false, features = ["textlayout"] }
glow = "0.17.0"
imgref = "1.12.2"
jpeg-encoder = "0.7.1"
opencv = { version = "0.100.1", default-features = false, features = ["clang-runtime", "features2d", "imgproc"], optional = true }
png = "0.18.1"
resvg = { version = "0.47.0", default-features = false }
rgb = "0.8.53"
serde_json = "1.0"
slint = { version = "1.17.1", default-features = false, features = ["compat-1-2", "renderer-femtovg", "std", "system-tray"] }
swash = "0.2.10"

[features]
default = ["opencv-orb"]
opencv-orb = ["dep:opencv"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_ColorSystem",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
